<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Master Form Suite</title>

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <div class="container">
      <h1 class="text-center mt-4">Master Form Suite</h1>

      <!-- FORM SELECTOR -->

      <div class="text-center mb-4">
        <button class="btn btn-info form-btn" data-form="contact">
          Contact
        </button>
        <button class="btn btn-success form-btn" data-form="login">
          Login
        </button>
        <button class="btn btn-primary form-btn" data-form="signup">
          Signup
        </button>
        <button class="btn btn-warning form-btn" data-form="match">
          Get Matched
        </button>
      </div>

      <!-- CONTACT FORM -->

      <div class="form-section form-container" id="contact">
        <h3>Contact Us</h3>

        <form id="contactForm">
          <div class="form-group">
            <label>Name</label>
            <input type="text" class="form-control" id="contactName" />
            <small class="text-danger error" id="contactNameError"></small>
          </div>

          <div class="form-group">
            <label>Email</label>
            <input type="text" class="form-control" id="contactEmail" />
            <small class="text-danger error" id="contactEmailError"></small>
          </div>

          <div class="form-group">
            <label>Message</label>
            <textarea class="form-control" id="contactMessage"></textarea>
            <small class="text-danger error" id="contactMessageError"></small>
          </div>
          <button type="submit" class="btn btn-primary">Send</button>
        </form>
      </div>

      <!-- LOGIN -->

      <div class="form-section form-container" id="login">
        <h3>Login</h3>

        <form id="loginForm">
          <div class="form-group">
            <label>Email</label>
            <input type="text" class="form-control" id="loginEmail" />
            <small class="text-danger" id="loginEmailError"></small>
          </div>

          <div class="form-group">
            <label>Password</label>
            <input type="password" class="form-control" id="loginPassword" />
            <small class="text-danger" id="loginPasswordError"></small>
          </div>

          <button type="submit" class="btn btn-success">Login</button>
        </form>
      </div>

      <!-- SIGNUP -->

      <div class="form-section form-container" id="signup">
        <h3>Signup</h3>

        <form id="signupForm">
          <div class="form-group">
            <label>Email</label>
            <input type="text" class="form-control" id="signupEmail" />
            <small class="text-danger error" id="signupEmailError"></small>
          </div>

          <div class="form-group">
            <label>Password</label>
            <input type="password" class="form-control" id="signupPassword" />
            <small class="text-danger error" id="signupPasswordError"></small>
          </div>

          <div class="form-group">
            <label>Confirm Password</label>
            <input type="password" class="form-control" id="confirmPassword" />
            <small class="text-danger error" id="confirmPasswordError"></small>
          </div>

          <button type="submit" class="btn btn-primary">Signup</button>
        </form>
      </div>

      <!-- GET MATCHED -->

      <div class="form-section form-container" id="match">
        <h3>Get Matched</h3>

        <form id="matchForm">
          <!-- STEP 1 -->
          <div class="step">
            <div class="form-group">
              <label>Name</label>
              <input type="text" class="form-control" id="matchName" />
              <small class="text-danger error" id="matchNameError"></small>
            </div>

            <button type="button" class="btn btn-primary next">Next</button>
          </div>

          <!-- STEP 2 -->
          <div class="step">
            <div class="form-group">
              <label>Interest</label>

              <select class="form-control" id="interest">
                <option value="">Select</option>
                <option>Technology</option>
                <option>Sports</option>
                <option>Music</option>
              </select>

              <small class="text-danger error" id="interestError"></small>
            </div>

            <button type="button" class="btn btn-secondary prev">
              Previous
            </button>
            <button type="button" class="btn btn-primary next">Next</button>
          </div>

          <!-- STEP 3 -->
          <div class="step">
            <div class="form-group">
              <label>Email</label>
              <input type="text" class="form-control" id="matchEmail" />
              <small class="text-danger error" id="matchEmailError"></small>
            </div>

            <button type="button" class="btn btn-secondary prev">
              Previous
            </button>
            <button type="submit" class="btn btn-success">Submit</button>
          </div>
        </form>
      </div>
    </div>

    <!-- NEWSLETTER -->

    <div class="newsletter">
      <h4>Subscribe to our Newsletter</h4>

      <form id="newsletterForm" class="form-inline justify-content-center">
        <input
          type="text"
          id="newsletterEmail"
          class="form-control mr-2"
          placeholder="Enter Email"
        />

        <small class="text-danger error" id="newsletterError"></small>

        <button type="submit" class="btn btn-warning">Subscribe</button>
      </form>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <script src="js/validation.js"></script>

    <script>
      $(document).ready(function () {
        $(".form-container").hide();
        $("#contact").show();

        $(".form-btn").click(function () {
          var formID = $(this).data("form");

          $(".form-container").hide();

          $("#" + formID).show();
        });
      });
    </script>
  </body>
</html>
